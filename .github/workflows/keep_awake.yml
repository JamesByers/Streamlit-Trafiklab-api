name: Keep Streamlit Awake

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Ping with Headless Browser
        id: ping_step
        run: |
          python -c '
          import sys
          import time
          from playwright.sync_api import sync_playwright

          url = "https://app-trafiklab-api-6mmxjd7mslxhtojzu7fv2d.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--no-sandbox", "--disable-setuid-sandbox"]
              )
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
              )
              page = context.new_page()

              print("Sending request to Streamlit app...")
              start_time = time.time()

              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  page.wait_for_timeout(5000)

                  wake_selectors = [
                      "button:has-text(\"Yes, get this app back up!\")",
                      "button:has-text(\"Wake\")",
                      "button:has-text(\"wake\")",
                      "[data-testid=\"baseButton-primary\"]"
                  ]

                  wake_button = None
                  for selector in wake_selectors:
                      loc = page.locator(selector).first
                      if loc.is_visible(timeout=2000):
                          wake_button = loc
                          print(f"Found wake button using selector: {selector}")
                          break

                  if wake_button:
                      print("App is asleep. Clicking wake button...")
                      wake_button.click()
                      print("Clicked! Waiting 25 seconds for container reboot...")
                      page.wait_for_timeout(25000)
                  else:
                      print("No wake button detected. Simulating active user session...")
                      page.mouse.move(100, 100)
                      page.mouse.click(100, 100)
                      page.wait_for_timeout(8000)

                  page_content = page.content()
                  if "This app has gone to sleep" in page_content or "gone to sleep due to inactivity" in page_content:
                      print("ERROR: App is still on the sleep screen despite attempt!")
                      sys.exit(1)

                  load_time = time.time() - start_time
                  print(f"SUCCESS: App verified online in {load_time:.2f} seconds!")

              except Exception as e:
                  load_time = time.time() - start_time
                  print(f"ERROR: Ping workflow failed after {load_time:.2f} seconds. Details: {e}")
                  browser.close()
                  sys.exit(1)

              browser.close()
          '

      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ⚠️ Streamlit App Keep-Alive Failed" >> $GITHUB_STEP_SUMMARY
          echo "The ping script was unable to connect to the Streamlit app or trigger a wake-up." >> $GITHUB_STEP_SUMMARY
          echo "[Click here to inspect the app manually](https://app-trafiklab-api-6mmxjd7mslxhtojzu7fv2d.streamlit.app/)" >> $GITHUB_STEP_SUMMARY
