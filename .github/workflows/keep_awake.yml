name: Keep Streamlit Awake

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps
          
      - name: Ping with Headless Browser
        id: ping_step
        run: |
          python -c "
          import sys
          import time
          from playwright.sync_api import sync_playwright

          url = 'https://app-trafiklab-api-6mmxjd7mslxhtojzu7fv2d.streamlit.app/'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              print('Sending request to app...')
              start_time = time.time()
              
              try:
                  page.goto(url, wait_until='domcontentloaded', timeout=60000)
                  
                  wake_button = page.locator('button:has-text(\"Yes, get this app back up!\")')
                  if wake_button.is_visible(timeout=5000):
                      print('App is currently asleep. Clicking wake button...')
                      wake_button.click()
                      page.wait_for_timeout(15000)
                  else:
                      print('App is online. Waiting for WebSocket handshake...')
                      page.wait_for_timeout(5000)
                  
                  load_time = time.time() - start_time
                  print(f'SUCCESS: App responded in {load_time:.2f} seconds!')
              except Exception as e:
                  load_time = time.time() - start_time
                  print(f'ERROR: Script failed after {load_time:.2f} seconds. Details: {e}')
                  browser.close()
                  sys.exit(1)
              
              browser.close()
          "

      - name: Report Failure Summary
        if: failure()
        run: |
          echo "### ⚠️ Streamlit App Keep-Alive Failed" >> $GITHUB_STEP_SUMMARY
          echo "The ping script was unable to connect to the Streamlit app or trigger a wake-up." >> $GITHUB_STEP_SUMMARY
          echo "[Click here to inspect the app manually](https://app-trafiklab-api-6mmxjd7mslxhtojzu7fv2d.streamlit.app/)" >> $GITHUB_STEP_SUMMARY
