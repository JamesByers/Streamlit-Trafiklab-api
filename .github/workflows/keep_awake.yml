name: Keep Streamlit Awake

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Playwright package
        run: pip install playwright
        
      # --- NEW: Check GitHub Cache for the Browser ---
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium
          
      # --- NEW: Only download if it wasn't in the cache ---
      - name: Install Chromium binary
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: playwright install chromium
          
      - name: Ping with Headless Browser
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              
              print('Sending request to app...')
              start_time = time.time()
              
              try:
                  page.goto('https://app-trafiklab-api-6mmxjd7mslxhtojzu7fv2d.streamlit.app/', wait_until='networkidle', timeout=60000)
                  load_time = time.time() - start_time
                  print(f'SUCCESS: App responded and fully loaded in {load_time:.2f} seconds!')
              except Exception as e:
                  load_time = time.time() - start_time
                  print(f'WARNING: Timed out after {load_time:.2f} seconds. Error: {e}')
              
              time.sleep(5)
              browser.close()
          "
